data:text/html,<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Pulse</title><style>*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;height:100vh;background:#090b0a;color:#eff3ee;font:14px/1.3 system-ui}button{width:min(68vw,220px);aspect-ratio:1;border-radius:50%;border:1px solid #2a302d;background:radial-gradient(circle at 30% 30%,#171d1a,#0d100e);color:#dfe6df;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 0 18px #fff0,0 0 0 1px #33413b inset;transition:.08s ease}button:active,button.on{background:radial-gradient(circle at 30% 30%,#3e4e3a,#121813);border-color:#d6f1a8;box-shadow:0 0 0 18px #fff1,0 0 0 1px #d6f1a8 inset}#score{position:fixed;left:50%;top:18px;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:#899287}#score:before{content:"score ";opacity:.7}#android{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:1px;text-transform:lowercase;color:#69736a}</style><button id=pad>Tap</button><div id=android>Only on android</div><script>let q=s=>document.querySelector(s),pad=q('#pad'),scoreEl=q('#score')||Object.assign(document.body.appendChild(document.createElement('div')), {id:'score', textContent:'0'}),seq=[],taps=[],state=0,round=0,start=0,score=0,ctx;function v(n){if(navigator.vibrate)navigator.vibrate(n)}function tone(f,d=.08){ctx=ctx||new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.001;g.gain.exponentialRampToValueAtTime(.03,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d+.02)}function play(){state=1;let t=0;seq.forEach((d,i)=>setTimeout(()=>{tone([180,260,360,460,620][i%5],.07);v(12);pad.classList.add('on');setTimeout(()=>pad.classList.remove('on'),110)},t+=d));setTimeout(()=>{state=2;taps=[];start=performance.now();pad.textContent='Repeat'},t+160)}function next(){seq=[220];for(let i=1;i<Math.min(round+3,5);i++)seq.push([120,180,240,320,420,520][Math.random()*6|0]);play()}pad.onclick=()=>{if(state===1||state===3)return;if(!state){pad.textContent='Listen';v(25);next();return}let now=performance.now();if(taps.length>=seq.length)return;let gap=now-start;if(!taps.length)start=now;taps.push(now-start);tone(220,.05);v(16);pad.classList.add('on');setTimeout(()=>pad.classList.remove('on'),90);if(taps.length===seq.length){if(seq.every((d,i)=>Math.abs(taps[i]-d)<260)){round++;scoreEl.textContent=++score;pad.textContent='Good';v(30);state=0;setTimeout(next,500)}else{score=0;scoreEl.textContent='0';round=0;pad.textContent='Retry';v(60);state=3;setTimeout(()=>{state=0;pad.textContent='Tap'},700)}}else start=now};</script>
