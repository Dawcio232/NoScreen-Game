<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse</title><style>
*{box-sizing:border-box}body{margin:0;background:#080909;color:#f1f3ef;font:14px system-ui}main{height:100vh;padding:24px;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:auto}h1{font-size:14px;font-weight:500}.scores{display:flex;gap:52px;margin-bottom:56px}.scores span{display:block;color:#777;font-size:10px;letter-spacing:2px}.scores b{display:block;font-size:24px;font-weight:400;margin-top:6px}.center{align-self:center;justify-self:center;text-align:center}.wrap{width:min(64vw,270px);aspect-ratio:1;border:1px solid #202522;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 24px #ffffff04}.pad{width:76%;height:76%;border:1px solid #343b37;border-radius:50%;background:radial-gradient(#191d1b,#0b0d0c);color:#929a95;touch-action:manipulation}.pad:focus-visible{outline:2px solid white}.pad.on{border-color:#b8f28b;background:#293323}.pad.bad{border-color:#ff9589}p{color:#929995;margin:42px 0 0;font-size:12px;min-height:18px}
</style><main><header><h1>Usable ONLY on android.</h1></header><section class="center"><div class="scores"><div><span>SCORE</span><b id="score">0</b></div><div><span>BEST</span><b id="best">0</b></div></div><div class="wrap"><button class="pad" id="pad" aria-label="Tap to start"><span id="label">Tap to start</span></button></div><p id="msg">Listen closely. Then tap it back.</p></section></main><script>
let q=s=>document.querySelector(s),pad=q('#pad'),label=q('#label'),scoreEl=q('#score'),best=q('#best'),v=!!navigator.vibrate,score=0,round=1,seq=[],taps=[],state=0,start=0;try{best.textContent=localStorage.best||0}catch(e){}function play(){let last=0,pattern=[65];seq.forEach((beat,i)=>{if(i)pattern.push(beat-last-65,65);last=beat;setTimeout(()=>pad.classList.add('on'),beat);setTimeout(()=>pad.classList.remove('on'),beat+130)});if(v)navigator.vibrate(pattern);state=1;label.textContent='Listen';setTimeout(()=>{state=2;taps=[];label.textContent='Repeat'},seq.at(-1)+500)}function next(){seq=[0];for(let i=1;i<Math.min(3+(round-1>>1),9);i++)seq.push(seq.at(-1)+[280,420,620,820][Math.random()*4|0]);play()}pad.onclick=()=>{if(state===1||state===3)return;if(!state){if(!seq.length){next();return}play();return}let now=performance.now();if(!taps.length)start=now;taps.push(now-start);if(v)navigator.vibrate(30);pad.classList.add('on');setTimeout(()=>pad.classList.remove('on'),100);if(taps.length===seq.length){if(seq.every((beat,i)=>Math.abs(taps[i]-beat)<230)){scoreEl.textContent=++score;round++;if(score>+best.textContent){best.textContent=score;try{localStorage.best=score}catch(e){}}state=3;label.textContent='Good';setTimeout(next,850)}else{score=0;round=1;scoreEl.textContent=0;state=0;label.textContent='Retry';pad.classList.add('bad');setTimeout(()=>pad.classList.remove('bad'),300)}}};
</script>
